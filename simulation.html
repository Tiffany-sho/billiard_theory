<meta charset="utf-8">
<title>ビリヤード軌道・ポアンカレ断面</title>

<!--
  古典ビリヤードの軌道とポアンカレ断面を、パラメータを振りながら見比べるための1枚もの。

  設計と規約:
    docs/requirements.md  何を作るか（Must M1-M5 / 受け入れ基準 / 非スコープ）
    docs/contracts.md     弧長 s・法線 n・sinφ・パラメータ名の定義。ここが正
    CLAUDE.md             このリポジトリ固有の注意

  このファイルは自己完結。CDN も外部フォントも fetch も使わない（ネットを切っても動く）。
  ビルド不要。ダブルクリックでブラウザが開けばそれで動く。

  script は3つに分けてある:
    billiard-core  数値核。DOM に一切触らない。Node からも同じコードを実行できる
    billiard-ref   Python が書き出した参照値（tools/dump_section.py が自動生成）
    billiard-ui    画面。Step 3 以降で実装する
-->

<style>

  --ink-3:#8b919b;

  --dot:#000000;        /* 断面の点 */
  --heat:#1b7f4b;       /* 占有領域の塗り（matplotlib 版の green に相当） */
  --handle:#1d6fd0;     /* ドラッグできる初期条件のハンドル */
  --ok:#1b7f4b;
  --ng:#b3261e;
  --mono:"Consolas","SF Mono",ui-monospace,monospace;
}

body{

}

}

/* 軌道図は正方形に近く、ポアンカレ断面は横長にする。
   断面の横軸の幅は形状で大きく変わる（スタジアム W=H=5 で約 ±12.9、卵型は ±π）が、
   縦軸はつねに ±1 なので、同じ幅で並べると断面側の縦が大きく余る。
   要件の差し戻し R1 で「軌道図は 1:1 固定 / 断面は横いっぱいに伸ばす」と決めた。 */
.panels{display:grid; grid-template-columns:minmax(230px,34%) 1fr; gap:16px}

}

}

}

<script id="billiard-core">
"use strict";
/* =====================================================================
   数値核。DOM に触らない。Node からもそのまま実行できる。

   移植の作法（docs/contracts.md と CLAUDE.md より）:
     - Python の式を演算順序ごとそのまま写す。浮動小数は結合則を満たさないので
       括弧を付け替えると 35 衝突後には 1e-6 を割りうる。「整理」しない。
     - Python が None / inf を返す経路は null を返し、呼び出し側で計算を止める。
       黙って NaN を先へ流さない。
     - 分岐の比較（abs(y) == H/2 など）も Python のまま写す。
       直線部の交点は y を ±H/2 と直接代入して作るので厳密比較が成立し、
       円弧部の交点が偶然そこに乗ることはない。
       ここで独自に境界へ丸める（スナップする）と座標が Python と 1e-16 ずれ、
       カオス系では 35 衝突で増幅されうるので、あえて丸めない。
       唯一スナップするのはシナイの障害物で、これは Python 側が既にやっている。
   ===================================================================== */

var Billiard = (function () {

  /* ---------------------------------------------------------------- 小道具 */

  // np.linalg.norm / class/vector_func.py: norm2 と同じ。2成分なので sqrt(x*x + y*y)。
  function norm2(v) { return Math.sqrt(v[0] * v[0] + v[1] * v[1]); }

  // np.sign と同じ（0 は 0、-0 は -0 を返す）。Math.sign がそのまま一致する。
  function sgn(x) { return Math.sign(x); }

  function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }

  /* 円弧を折れ線として標本化する。a0 -> a1 を n 等分（角度で等間隔）。
     角度で刻むと弧長に対して等間隔になるので、少ない点数でも滑らかに見える。
     y = sqrt(r^2 - x^2) のように x で刻むと上下端で点が極端に粗くなり、
     カクつきを消すのに桁違いの点数が要る（setting.py にも同じ趣旨のメモがある）。 */
  function sampleArc(cx, cy, r, a0, a1, n) {
    var pts = [];
    for (var k = 0; k <= n; k++) {
      var t = a0 + (a1 - a0) * k / n;
      pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
    }
    return pts;
  }

  var ARC_SAMPLES = 180;   // 半円あたりの分割数

  function boxPts(W, H) {
    return [[-W / 2, -H / 2], [W / 2, -H / 2], [W / 2, H / 2], [-W / 2, H / 2]];
  }

  /* 卵型・楕円の境界。右半分は a = W_r/2、左半分は a = W_l/2 の半楕円を
     x = a cos t, y = (H/2) sin t で貼り合わせる。
     t = ±π/2 では x = 0 になり左右の式が一致するので、継ぎ目は連続。 */
  function eggBoundary(W_r, W_l, H) {
    var ar = W_r / 2, al = W_l / 2, b = H / 2, n = ARC_SAMPLES;
    var pts = [], k, t;
    for (k = 0; k <= n; k++) {
      t = -Math.PI / 2 + Math.PI * k / n;
      pts.push([ar * Math.cos(t), b * Math.sin(t)]);
    }
    for (k = 1; k <= n; k++) {
      t = Math.PI / 2 + Math.PI * k / n;
      pts.push([al * Math.cos(t), b * Math.sin(t)]);
    }
    return [{ closed: true, pts: pts }];
  }

  function finite2(a) {
    return a != null && isFinite(a[0]) && isFinite(a[1]);
  }

  // np.isclose(a, b) の既定値 rtol=1e-05, atol=1e-08 をそのまま写したもの。
  // 矩形の「角ちょうど」判定に使われているので、既定値をずらすと挙動が変わる。
  function isclose(a, b) {
    return Math.abs(a - b) <= (1e-8 + 1e-5 * Math.abs(b));
  }

  /* ================================================================ 共通ループ */

  /**
   * 衝突 1..N を計算する。
   * docs/contracts.md [D2]: 断面に載せるのは衝突点のみ。初期位置は載せない。
   * 各衝突には「入ってきたときの速度」(vx, vy) を持たせる。
   * sinφ は入射でも反射後でも数学的に同値だが、丸めで最下位ビットが違うので入射に固定する。
   */
  function simulate(shape, P, p0, v0, N) {
    var collisions = [];
    var p = [p0[0], p0[1]];
    var v = [v0[0], v0[1]];

    for (var i = 1; i <= N; i++) {
      var q = shape.intersect(P, p, v);
      if (!finite2(q)) {
        return { collisions: collisions, stop: { reason: "no-intersection", at: i } };
      }

      collisions.push({ i: i, x: q[0], y: q[1], vx: v[0], vy: v[1] });

      var nv = shape.reflect(P, q, v);
      if (!finite2(nv)) {
        return { collisions: collisions, stop: { reason: "bad-reflection", at: i } };
      }

      v = nv;
      p = q;
    }
    return { collisions: collisions, stop: null };
  }

  /**
   * ポアンカレ断面の点列 {i, s, sin} を作る。
   * sinφ = v̂ × n̂（2次元の外積）。n の向きは全形状で領域の内側（docs/contracts.md [D1]）。
   *
   * shape.normal() は Python の get_normal_vector が返すものをそのまま返す。
   * スタジアムだけ既に正規化済みのベクトルを返すが、Python 側も
   * そのあと重ねて正規化しているので、ここでも同じく正規化し直す。
   * 「無駄だから」と省くと最下位ビットが変わる。
   */
  function section(shape, P, collisions) {
    var out = [];
    for (var k = 0; k < collisions.length; k++) {
      var c = collisions[k];
      var q = [c.x, c.y];
      var v = [c.vx, c.vy];
      var n = shape.normal(P, q, v);
      var nh = [n[0] / norm2(n), n[1] / norm2(n)];
      var vh = [v[0] / norm2(v), v[1] / norm2(v)];
      out.push({
        i: c.i,
        s: shape.coord(P, q),
        sin: vh[0] * nh[1] - vh[1] * nh[0]
      });
    }
    return out;
  }

  /* ================================================================ スタジアム
     移植元: class/stadium_func.py
     W = 矩形部の幅 / H = 高さ = 両端の半円の直径。W = 0 で半径 H/2 の真円。 */

  var stadium = {
    id: "stadium",
    label: "スタジアム",
    axis: "arc",
    params: [
      { key: "W", label: "W", min: 0, max: 20, step: 0.1, def: 5.0 },
      { key: "H", label: "H", min: 0.1, max: 20, step: 0.1, def: 5.0 }
    ],

    // find_intersection_reversion(point, velocity, W, D) の D は高さ H のこと。
    intersect: function (P, point, velocity) {
      var W = P.W, D = P.H;

      if (velocity[0] === 0 && velocity[1] === 0) return [point[0], point[1]];

      if (velocity[0] === 0) {
        var x = point[0], y;
        if (Math.abs(point[0]) <= W / 2) y = sgn(velocity[1]) * D / 2;
        else if (point[0] < -W / 2) y = sgn(velocity[1]) * Math.sqrt((D / 2) * (D / 2) - (x + W / 2) * (x + W / 2));
        else y = sgn(velocity[1]) * Math.sqrt((D / 2) * (D / 2) - (x - W / 2) * (x - W / 2));
        return [x, y];
      }

      if (velocity[1] === 0) {
        var yy = point[1];
        var xx = -sgn(yy) * Math.sqrt((D / 2) * (D / 2) - yy * yy) + sgn(velocity[0]) * W / 2;
        return [xx, yy];
      }

      var temp_y = velocity[1] > 0 ? D / 2 : -D / 2;
      var temp_t = (temp_y - point[1]) / velocity[1];

      if (temp_t >= 0) {
        var temp_x = point[0] + temp_t * velocity[0];

        if (Math.abs(temp_x) <= W / 2) return [temp_x, temp_y];

        // 円弧との交点。中心 (±W/2, 0)、半径 D/2 の円に対する2次方程式。
        // 手前の根ではなく max（遠い方）を取るのが「reversion」の肝で、
        // いま境界上にいる場合の t = 0 という自明な根を捨てるため。
        var side = temp_x > W / 2 ? 1 : (temp_x < -W / 2 ? -1 : 0);
        if (side === 0) return null;

        var A = velocity[0] * velocity[0] + velocity[1] * velocity[1];
        var B = point[0] * velocity[0] + point[1] * velocity[1] - side * W / 2 * velocity[0];
        var C = point[0] * point[0] + point[1] * point[1] + W * W / 4 - D * D / 4 - side * W * point[0];
        var Disc = B * B - A * C;

        if (Disc < 0) return null;

        var t1, t2;
        if (B === 0) {
          t1 = Math.sqrt(-A * C) / A;
          t2 = C / A / t1;
        } else {
          t1 = (-B - sgn(B) * Math.sqrt(Disc)) / A;
          t2 = C / A / t1;

        if (valid.length === 0) return null;

        var t = Math.max.apply(null, valid);

        if (side > 0 && point[0] + t * velocity[0] < W / 2) return null;
        if (side < 0 && point[0] + t * velocity[0] > -W / 2) return null;

        return [point[0] + t * velocity[0], point[1] + t * velocity[1]];
      }

      return null;   // Python では暗黙の None
    },

    reflect: function (P, q, velocity) {

      var speed = norm2(velocity);
      var reflected;

      if (Math.abs(q[0]) <= W / 2) {
        reflected = [velocity[0], -velocity[1]];

    dashes: function (P) {

    },
    defaultPosition: function () { return [0, 0]; }
  };

  /* ================================================================ シナイ
     移植元: class/sinai_func.py
     外壁 |x| <= W/2, |y| <= H/2 の矩形 ＋ 原点中心・直径 D の円形障害物。 */

  var sinai = {
    id: "sinai",
    label: "シナイ",
    axis: "arc",
    params: [
      { key: "W", label: "W", min: 0.2, max: 20, step: 0.1, def: 5.0 },
      { key: "H", label: "H", min: 0.2, max: 20, step: 0.1, def: 5.0 },
      { key: "D", label: "D", min: 0.1, max: 10, step: 0.1, def: 2.0 }
    ],

    intersect: function (P, point, velocity) {
      var W = P.W, H = P.H, D = P.D;

      if (velocity[0] === 0.0 && velocity[1] === 0.0) return [point[0], point[1]];

      if (velocity[0] === 0.0) {
        var x = point[0], y;
        if (Math.abs(x) > D / 2 && Math.abs(x) < W / 2) {
          return [x, sgn(velocity[1]) * H / 2];
        }
        if (velocity[1] * point[1] >= 0) y = sgn(velocity[1]) * H / 2;
        else y = sgn(point[1]) * Math.sqrt((D / 2) * (D / 2) - x * x);

      if (velocity[1] === 0.0) {
        var yy = point[1], xx;

          return [sgn(velocity[0]) * W / 2, yy];
        }
        if (velocity[0] * point[0] >= 0) xx = sgn(velocity[0]) * W / 2;
        else xx = sgn(point[0]) * Math.sqrt((D / 2) * (D / 2) - yy * yy);
        return [xx, yy];
      }

      var A = velocity[0] * velocity[0] + velocity[1] * velocity[1];
      var B = dot(velocity, point);
      var C = point[0] * point[0] + point[1] * point[1] - (D / 2) * (D / 2);
      var disc = B * B - A * C;

      // 障害物へ向かっていない（B >= 0）か、そもそも交わらない（disc <= 0）なら外壁。
      if (disc <= 0 || B >= 0.0) {
        var temp_x = velocity[0] > 0 ? W / 2 : -W / 2;
        var tx = (temp_x - point[0]) / velocity[0];
        var temp_y = velocity[1] > 0 ? H / 2 : -H / 2;
        var ty = (temp_y - point[1]) / velocity[1];

        if (tx < ty) return [temp_x, point[1] + velocity[1] * tx];
        if (tx > ty) return [point[0] + velocity[0] * ty, temp_y];
        return [temp_x, temp_y];         // 角ちょうど

    },

    reflect: function (P, q, velocity) {
      var W = P.W, H = P.H, D = P.D;
      var speed = norm2(velocity);
      var reflected;

      if (Math.abs(norm2(q) - D / 2) < 1e-10) {

        var d = dot(velocity, nh);
        reflected = [velocity[0] - 2 * d * nh[0], velocity[1] - 2 * d * nh[1]];
      } else if (Math.abs(q[0]) === W / 2 && Math.abs(q[1]) === H / 2) {

      return [reflected[0] / rn * speed, reflected[1] / rn * speed];

      if (q[1] === H / 2) return [0.0, -1.0];
      if (q[0] === -W / 2) return [1.0, 0.0];
      if (q[1] === -H / 2) return [0.0, 1.0];
      return [-1.0, 0.0];

    // 原点は外壁の右上角。外壁を時計回りにたどり、そのあと障害物。

      if (q[0] === -W / 2) return W + H / 2 - q[1];
      if (q[1] === -H / 2) return W + H + W / 2 + q[0];
      return W + H + W + H / 2 + q[1];

    range: function (P) {
      return [0, 2 * (P.D * Math.PI / 2 + P.W + P.H)];   // setting.py: sinai_poincare_map_arc
    },
    dashes: function (P) {

    },
    bbox: function (P) {

    // 「外壁の内側 かつ 障害物の外側」。境界上ちょうどは領域外として扱う。

    },
    // 原点は外壁の右上角。外壁を時計回りにたどり、そのあと障害物。
    paramRange: function (P) { return [0, 2 * (P.D * Math.PI / 2 + P.W + P.H)]; },
    pointFromParam: function (P, s) {

      if (s <= W + H) return [-W / 2, W + H / 2 - s];                       // 左辺
      if (s <= 2 * W + H) return [s - W - H - W / 2, -H / 2];               // 下辺

        Math.abs(Math.abs(q[1]) - P.H / 2));

    // 外壁と障害物で2本の閉じた折れ線になる（唯一、連結でない境界）。
    boundaryPath: function (P) {
      return [
        { closed: true, pts: boxPts(P.W, P.H) },
        { closed: true, pts: sampleArc(0, 0, P.D / 2, 0, 2 * Math.PI, 2 * ARC_SAMPLES) }
      ];
    },
    defaultPosition: function (P) {
      return [(P.D / 2 + P.W / 2) / 2, 0];    // 障害物と右壁のちょうど中間
    }
  };

  /* ================================================================ 矩形
     移植元: func/squre/ の4ファイル（矩形だけまだクラス化されていない）。 */

  var rect = {
    id: "rect",
    label: "矩形",
    axis: "arc",
    params: [
      { key: "W", label: "W", min: 0.2, max: 20, step: 0.1, def: 5.0 },
      { key: "H", label: "H", min: 0.2, max: 20, step: 0.1, def: 5.0 }
    ],

    intersect: function (P, point, velocity) {
      var W = P.W, H = P.H;

      if (velocity[0] === 0.0 && velocity[1] === 0.0) return [point[0], point[1]];
      if (velocity[0] === 0.0) return [point[0], sgn(velocity[1]) * H / 2];
      if (velocity[1] === 0.0) return [sgn(velocity[0]) * W / 2, point[1]];

      var temp_x = velocity[0] > 0 ? W / 2 : -W / 2;
      var tx = (temp_x - point[0]) / velocity[0];
      var temp_y = velocity[1] > 0 ? H / 2 : -H / 2;

      var speed = norm2(velocity);

      } else if (Math.abs(q[0]) === W / 2) {
        reflected = [-velocity[0], velocity[1]];
      } else {
        reflected = [velocity[0], -velocity[1]];
      }

    },
    defaultPosition: function () { return [0, 0]; }
  };

  /* ================================================================ 卵型
     移植元: class/egg_func.py
     右半分 (x/(W_r/2))^2 + (y/(H/2))^2 = 1, x >= 0
     左半分 (x/(W_l/2))^2 + (y/(H/2))^2 = 1, x <= 0  を貼り合わせたもの。
     W_r == W_l のとき楕円と厳密に一致する（楕円はこのカーネルを使い回す）。 */

  function eggIntersect(point, velocity, W_r, W_l, H) {
    if (velocity[0] === 0 && velocity[1] === 0) return [point[0], point[1]];

    if (velocity[0] === 0) {
      var x = point[0], y, a;
      if (point[0] === 0) y = sgn(velocity[1]) * H / 2;
      else {
        a = point[0] > 0 ? W_r : W_l;
        y = sgn(velocity[1]) * H / 2 * Math.sqrt(1 - (x / (a / 2)) * (x / (a / 2)));
      }
      return [x, y];
    }

    if (velocity[1] === 0) {
      var yy = point[1], xx;
      if (point[1] === 0) {
        xx = velocity[0] > 0 ? W_r / 2 : -W_l / 2;
      } else {
        var s = Math.sqrt(1 - (yy / (H / 2)) * (yy / (H / 2)));
        xx = velocity[0] > 0 ? W_r / 2 * s : -W_l / 2 * s;
      }
      return [xx, yy];
    }

    var temp_y = velocity[1] > 0 ? H / 2 : -H / 2;
    var t0 = (temp_y - point[1]) / velocity[1];

    if (t0 > 0) {
      var temp_x = point[0] + t0 * velocity[0];
      if (temp_x === 0) return [0, sgn(velocity[1]) * H / 2];

      var Wc = temp_x > 0 ? W_r : W_l;
      var ax = Wc / 2, by = H / 2;

      var A = (velocity[0] / ax) * (velocity[0] / ax) + (velocity[1] / by) * (velocity[1] / by);
      var B = point[0] * velocity[0] / (ax * ax) + point[1] * velocity[1] / (by * by);
      var C = (point[0] / ax) * (point[0] / ax) + (point[1] / by) * (point[1] / by) - 1;
      var Disc = B * B - A * C;

      if (Disc < 0) return null;

      var t1, t2;
      if (B === 0) {
        t1 = Math.sqrt(-A * C) / A;
        t2 = C / A / t1;

<script id="billiard-ui">
"use strict";
/* 画面まわり。数値核（billiard-core）には一切手を入れない。
   ここでの決めごと:
     - 色は必ず CSS カスタムプロパティから読む。生の色コードを書かない。
     - 軌道図はアスペクト比 1:1 固定、断面は横いっぱいに伸ばす（差し戻し R1）。 */

(function () {

  /* ---------------------------------------------------------------- 共通 */

  function readTokens() {
    var cs = getComputedStyle(document.documentElement);
    function t(name) { return cs.getPropertyValue(name).trim(); }
    return {
      boundary: t("--boundary"),
      orbit: t("--orbit"),
      dash: t("--dash"),
      dot: t("--dot"),
      heat: t("--heat"),
      handle: t("--handle"),
      paper: t("--paper"),
      tick: t("--ink-3"),
      rule: t("--rule"),
      mono: t("--mono")

  }

  /* CSS 上のサイズと実ピクセルを devicePixelRatio で合わせる。

  function fitCanvas(cv) {
    var dpr = window.devicePixelRatio || 1;
    /* getBoundingClientRect() ではなく clientWidth / clientHeight を使う。
       box-sizing:border-box と 1px のボーダーがあるので rect は内容ボックスより
       2px 大きく、それを canvas.width にすると描画面が内容ボックスへ縮小されて
       表示される。すると「描いた位置」と「マウス座標」が数 px ずれ、
       断面のホバーが隣の点を拾う。clientWidth はボーダーを含まないので一致する。 */
    var w = Math.max(1, cv.clientWidth || Math.round(cv.getBoundingClientRect().width));
    var h = Math.max(1, cv.clientHeight || Math.round(cv.getBoundingClientRect().height));

    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);

    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var s = project(pts[i][0], pts[i][1]);
      if (i === 0) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]);
    }

    ctx.stroke();
  }

  /* ---------------------------------------------------------------- 軌道図 */

  var ORBIT_MARGIN = 14;

  /* 等倍スケール（x と y で同じ倍率）を使うのでアスペクト比が 1:1 に保たれる。
     余りは左右か上下の余白になる。形状が歪むと反射の見え方を誤解するため、
     ここは枠の形に合わせて伸ばしてはいけない（受け入れ基準16）。 */
  function orbitProjector(shape, P, w, h) {
    var bb = shape.bbox(P);
    var bw = bb[2] - bb[0], bh = bb[3] - bb[1];
    if (!(bw > 0) || !(bh > 0)) return null;

    var scale = Math.min((w - 2 * ORBIT_MARGIN) / bw, (h - 2 * ORBIT_MARGIN) / bh);
    var cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;

    // ドラッグで画面座標から世界座標へ戻す必要があるので、逆変換も返す。
    // y は画面が下向き正なので、どちらの向きでも反転させる。
    return {
      scale: scale,
      toScreen: function (x, y) {
        return [w / 2 + (x - cx) * scale, h / 2 - (y - cy) * scale];

      toWorld: function (px, py) {

  var ARROW_PX = 46, GRAB_PX = 11;

    var sp = pr.toScreen(p0[0], p0[1]);

    return dx * dx + dy * dy;
  }

  function drawOrbit(cv, shape, P, p0, collisions, upto, hi, T, v0) {
    var g = fitCanvas(cv), ctx = g.ctx;
    var pr = orbitProjector(shape, P, g.w, g.h);
    if (!pr) return;
    var S = pr.toScreen;

    ctx.strokeStyle = T.boundary;
    ctx.lineWidth = 1;
    shape.boundaryPath(P).forEach(function (sub) {

    });

    var n = Math.min(upto, collisions.length);
    if (n > 0) {
      /* 線分を1本ずつ描くと重なりが濃くなり、軌道がどこを密に通るかが見える
         （matplotlib 版が alpha=0.1 で1本ずつ描いているのと同じ効果）。
         ただし本数が増えると描画呼び出しのコストが効いてくるので、
         多いときは1本のパスにまとめる。まとめると重なりは濃くならない。 */
      var perSegment = n <= 3000;
      var alpha = perSegment
        ? Math.min(0.9, Math.max(0.05, 6 / Math.sqrt(n)))
        : Math.min(0.9, Math.max(0.04, 12 / Math.sqrt(n)));

      ctx.strokeStyle = T.orbit;
      ctx.lineWidth = 1;
      ctx.globalAlpha = alpha;

      if (perSegment) {

          var cur = S(collisions[k].x, collisions[k].y);
          ctx.beginPath();
          ctx.moveTo(prev[0], prev[1]);
          ctx.lineTo(cur[0], cur[1]);
          ctx.stroke();
          prev = cur;

        ctx.beginPath();
        ctx.moveTo(prev[0], prev[1]);
        for (var j = 0; j < n; j++) {
          var q = S(collisions[j].x, collisions[j].y);
          ctx.lineTo(q[0], q[1]);

        ctx.stroke();

      ctx.globalAlpha = 1;

      // 衝突点。多すぎると境界が点で埋まって形が読めなくなるので打ち切る。

        ctx.fillStyle = T.dot;
        for (var m = 0; m < n; m++) {
          var d = S(collisions[m].x, collisions[m].y);
          ctx.fillRect(d[0] - 1.25, d[1] - 1.25, 2.5, 2.5);
        }
      }
    }

    // 相互ハイライト（Step 5 で断面のホバーから渡ってくる）
    if (hi != null && hi >= 1 && hi <= n) {
      var c = collisions[hi - 1];
      var from = hi >= 2 ? [collisions[hi - 2].x, collisions[hi - 2].y] : p0;
      var a = S(from[0], from[1]), b = S(c.x, c.y);

      ctx.strokeStyle = T.dash;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(b[0], b[1], 5, 0, 2 * Math.PI);
      ctx.stroke();

    // ドラッグできる初期条件のハンドル（初期位置と初速度の向き）
    if (v0) drawStartHandles(ctx, pr, p0, v0, T);
  }

    var sp = pr.toScreen(p0[0], p0[1]);
    var tip = velocityHandle(pr, p0, v0);

    ctx.strokeStyle = T.handle;
    ctx.fillStyle = T.handle;
    ctx.lineWidth = 1.8;

    // 軸
    ctx.beginPath();
    ctx.moveTo(sp[0], sp[1]);
    ctx.lineTo(tip[0], tip[1]);
    ctx.stroke();

    // 矢じり
    var ang = Math.atan2(tip[1] - sp[1], tip[0] - sp[0]);
    ctx.beginPath();
    ctx.moveTo(tip[0], tip[1]);
    ctx.lineTo(tip[0] - 9 * Math.cos(ang - 0.4), tip[1] - 9 * Math.sin(ang - 0.4));
    ctx.lineTo(tip[0] - 9 * Math.cos(ang + 0.4), tip[1] - 9 * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();

    // 初期位置。白で塗ってから縁取ると、黒い軌道の上でも見える
    ctx.beginPath();
    ctx.arc(sp[0], sp[1], 5, 0, 2 * Math.PI);
    ctx.fillStyle = T.paper;
    ctx.fill();
    ctx.strokeStyle = T.handle;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  /* ------------------------------------------------------------ 断面 */

  var SEC_PAD = { l: 38, r: 12, t: 12, b: 26 };

  /* 断面は軌道図と違って縦横を独立にとる。
     横軸 s の幅は形状で桁が違う（スタジアム W=H=5 で ±12.85、卵型は ±π）が、
     縦軸はつねに sinφ ∈ [-1, 1]。1:1 にすると縦が潰れて何も読めない。 */
  function sectionProjector(shape, P, w, h) {
    var rg = shape.range(P);
    var lo = rg[0], hi = rg[1];
    if (!(hi > lo)) return null;

    var iw = w - SEC_PAD.l - SEC_PAD.r;
    var ih = h - SEC_PAD.t - SEC_PAD.b;
    if (!(iw > 0) || !(ih > 0)) return null;

    return {
      lo: lo, hi: hi, iw: iw, ih: ih,
      X: function (s) { return SEC_PAD.l + (s - lo) / (hi - lo) * iw; },
      Y: function (v) { return SEC_PAD.t + (1 - v) / 2 * ih; }
    };
  }

  function fmtTick(v) {
    if (Math.abs(v) >= 100) return v.toFixed(0);
    if (Math.abs(v) >= 10) return v.toFixed(1);
    return v.toFixed(2);
  }

  function drawSection(cv, shape, P, pts, upto, hi, T) {
    var g = fitCanvas(cv), ctx = g.ctx;
    var pr = sectionProjector(shape, P, g.w, g.h);
    if (!pr) return;

    drawSectionFrame(ctx, shape, P, pr, T);

    // 点
    var n = Math.min(upto, pts.length);
    ctx.fillStyle = T.dot;
    for (var k = 0; k < n; k++) {
      ctx.fillRect(pr.X(pts[k].s) - 0.6, pr.Y(pts[k].sin) - 0.6, 1.2, 1.2);
    }

      var p = pts[hi - 1];
      ctx.strokeStyle = T.dash;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(pr.X(p.s), pr.Y(p.sin), 5, 0, 2 * Math.PI);
      ctx.stroke();
    }
  }

  /* ============================================================ 追加の描画

     単一軌道以外の3つの表示。断面の写像（sectionProjector）は使い回す。 */

  /** 重ね描き（S1）。初期値ごとに色を変えて断面へ重ねる。 */
  function drawSectionMix(cv, shape, P, runs, T) {
    var g = fitCanvas(cv), ctx = g.ctx;
    var pr = sectionProjector(shape, P, g.w, g.h);
    if (!pr) return;

    drawSectionFrame(ctx, shape, P, pr, T);

    for (var r = 0; r < runs.length; r++) {
      var pts = runs[r].pts;
      ctx.fillStyle = runs[r].color;
      for (var k = 0; k < pts.length; k++) {
        ctx.fillRect(pr.X(pts[k].s) - 0.6, pr.Y(pts[k].sin) - 0.6, 1.2, 1.2);
      }
    }
    drawSectionAxes(ctx, pr, T);
  }

  /** 占有領域（S2）。セルの通過回数を濃淡で塗る。 */
  function drawHeat(cv, shape, P, hist, T) {
    var g = fitCanvas(cv), ctx = g.ctx;
    var pr = sectionProjector(shape, P, g.w, g.h);
    if (!pr || !hist) return;

    var d = hist.divide;
    var max = 0;
    for (var i = 0; i < hist.cells.length; i++) {
      if (hist.cells[i] > max) max = hist.cells[i];
    }

    if (max > 0) {
      var cw = pr.iw / d, ch = pr.ih / d;
      for (var iy = 0; iy < d; iy++) {
        for (var ix = 0; ix < d; ix++) {

          ctx.fillStyle = T.heat;

          ctx.fillRect(SEC_PAD.l + ix * cw,

            Math.ceil(cw) + 0.5, Math.ceil(ch) + 0.5);

      }
      ctx.globalAlpha = 1;
    }

    drawSectionAxes(ctx, pr, T);
  }

  /** エントロピー（S3）。横軸 log2(N)、縦軸 S[bit]。理論上限を赤い水平線で示す。 */
  function drawEntropy(cv, series, divide, T) {
    var g = fitCanvas(cv), ctx = g.ctx;
    var w = g.w, h = g.h;
    var pad = { l: 44, r: 14, t: 14, b: 30 };
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    if (!(iw > 0) || !(ih > 0) || !series || series.length === 0) return;

    var top = Billiard.maxEntropy(divide);
    var xlo = series[0].x, xhi = series[series.length - 1].x;
    if (!(xhi > xlo)) { xhi = xlo + 1; }
    var ymax = top * 1.08;

    function X(v) { return pad.l + (v - xlo) / (xhi - xlo) * iw; }
    function Y(v) { return pad.t + (1 - v / ymax) * ih; }

    // 理論上限 log2(divide^2)
    ctx.save();
    ctx.strokeStyle = T.dash;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(pad.l, Y(top));
    ctx.lineTo(pad.l + iw, Y(top));
    ctx.stroke();
    ctx.restore();

    // 曲線
    ctx.strokeStyle = T.orbit;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (var k = 0; k < series.length; k++) {
      var px = X(series[k].x), py = Y(series[k].s);
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.fillStyle = T.dot;
    for (var m = 0; m < series.length; m++) {
      ctx.fillRect(X(series[m].x) - 1.5, Y(series[m].s) - 1.5, 3, 3);
    }

    ctx.strokeStyle = T.boundary;
    ctx.lineWidth = 1;
    ctx.strokeRect(pad.l, pad.t, iw, ih);

    ctx.fillStyle = T.tick;
    ctx.font = "10px " + T.mono;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(top.toFixed(2), pad.l - 5, Y(top));
    ctx.fillText("0", pad.l - 5, Y(0));
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.fillText("log2(N)=" + xlo.toFixed(1), pad.l, pad.t + ih + 5);
    ctx.textAlign = "right";
    ctx.fillText(xhi.toFixed(1), pad.l + iw, pad.t + ih + 5);
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("S [bit]  上限 log2(divide^2) = " + top.toFixed(3),
      pad.l + 4, Y(top) - 4);
  }

  /* drawSection から枠・破線・目盛を切り出して、3つの表示で使い回す */
  function drawSectionFrame(ctx, shape, P, pr, T) {
    ctx.strokeStyle = T.rule;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(SEC_PAD.l, pr.Y(0));
    ctx.lineTo(SEC_PAD.l + pr.iw, pr.Y(0));
    ctx.stroke();

    ctx.save();
    ctx.strokeStyle = T.dash;
    ctx.setLineDash([4, 3]);
    shape.dashes(P).forEach(function (d) {
      if (d <= pr.lo || d >= pr.hi) return;
      var x = pr.X(d);
      ctx.beginPath();
      ctx.moveTo(x, SEC_PAD.t);
      ctx.lineTo(x, SEC_PAD.t + pr.ih);
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawSectionAxes(ctx, pr, T) {
    ctx.strokeStyle = T.boundary;
    ctx.lineWidth = 1;
    ctx.strokeRect(SEC_PAD.l, SEC_PAD.t, pr.iw, pr.ih);

    ctx.fillStyle = T.tick;
    ctx.font = "10px " + T.mono;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText("+1", SEC_PAD.l - 5, pr.Y(1));
    ctx.fillText("0", SEC_PAD.l - 5, pr.Y(0));
    ctx.fillText("-1", SEC_PAD.l - 5, pr.Y(-1));

    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.fillText(fmtTick(pr.lo), SEC_PAD.l, SEC_PAD.t + pr.ih + 5);
    ctx.textAlign = "right";
    ctx.fillText(fmtTick(pr.hi), SEC_PAD.l + pr.iw, SEC_PAD.t + pr.ih + 5);
    if (pr.lo < 0 && pr.hi > 0) {
      ctx.textAlign = "center";
      ctx.fillText("0", pr.X(0), SEC_PAD.t + pr.ih + 5);
    }
  }

  /* ============================================================ 表示の切り替え */

  var VIEWS = {
    single: "初期条件を1つ与えて軌道と断面を見ます。軌道図の青い丸をドラッグすると初期位置、矢印の先をドラッグすると初速度の向きが変わります（速さは軌道に影響しないので変えません）。断面の点にカーソルを合わせると、軌道図の対応する衝突が強調されます。",
    mix: "境界を等分した位置に初期条件を撒き、色分けして断面に重ねます（main/(形状)/poincare_mix.py 相当）。積分可能系では曲線群に、エルゴード系では一様に散らばります。",
    occupancy: "断面を divide x divide の格子に分け、通過回数を濃淡で塗ります（paint_occupany_area 相当）。エントロピーの計算元です。軌道図のハンドルをドラッグして初期条件を動かせます。",
    entropy: "衝突回数を増やしながらシャノンエントロピーを計算します（shannon_entropy_mix 相当）。赤い破線は一様分布のときの上限 log2(divide^2)。"
  };

  var mixState = { epoch: 100, mixN: 1000, seed: 1, runs: null, ms: 0 };
  var gridState = { divide: 50, step: 100 };

  function applyView() {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-selected", b.dataset.view === state.view ? "true" : "false");
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-group]"), function (el) {
      var list = el.getAttribute("data-group").split(/\s+/);
      el.hidden = list.indexOf(state.view) < 0;
    });

    var hint = document.getElementById("view-hint");
    if (hint) hint.textContent = VIEWS[state.view] || "";

    // 重ね描きは軌道図を出さない（100本重なると読めないため。差し戻し R4）
    var panels = document.querySelector(".panels");
    if (panels) panels.classList.toggle("one",
      state.view === "mix" || state.view === "entropy");

    var capA = document.getElementById("cap-a");
    var capB = document.getElementById("cap-b");
    if (capA && capB) {
      if (state.view === "entropy") {
        capB.textContent = "シャノンエントロピー";
      } else if (state.view === "occupancy") {
        capA.textContent = "軌道図"; capB.textContent = "占有領域";
      } else {
        capA.textContent = "軌道図"; capB.textContent = "ポアンカレ断面";
      }
    }

    if (state.view === "mix" && !mixState.runs) computeMix();
    update({});
  }

  function computeMix() {
    var sh = shape();
    var rand = Billiard.makeRng(mixState.seed);
    var t0 = performance.now();
    var runs = [];
    var stopped = 0;

    for (var i = 0; i < mixState.epoch; i++) {
      var cs = Billiard.createSetting(sh, state.params, i, mixState.epoch, rand);
      var run = Billiard.simulate(sh, state.params, cs.p0, cs.v0, mixState.mixN);
      if (run.stop) stopped++;
      runs.push({
        pts: Billiard.section(sh, state.params, run.collisions),
        color: BASIC_COLORS[i % BASIC_COLORS.length]
      });
    }
    mixState.runs = runs;
    mixState.ms = performance.now() - t0;
    mixState.stopped = stopped;

    var msg = document.getElementById("msg-mix");
    if (msg) {
      msg.textContent = stopped
        ? stopped + " 本が途中で止まりました（交点が見つからない初期条件）"
        : "";
      msg.className = stopped ? "msg error" : "msg";
    }
  }

  /** エントロピーの系列。刻みごとにヒストグラムを差分で積む（Python 側と同じ考え方）。 */
  function entropySeries() {
    var sh = shape();
    var d = gridState.divide;
    var step = Math.max(1, gridState.step);
    var total = state.pts.length;
    if (total === 0) return [];

    var rg = sh.range(state.params), lo = rg[0], hi = rg[1];
    var cells = new Float64Array(d * d);
    var series = [];
    var counted = 0;

    for (var n = step; n <= total; n += step) {
      for (var k = counted; k < n; k++) {
        var ix = Math.floor((state.pts[k].s - lo) / (hi - lo) * d);
        var iy = Math.floor((state.pts[k].sin + 1) / 2 * d);
        if (ix < 0) ix = 0; else if (ix >= d) ix = d - 1;
        if (iy < 0) iy = 0; else if (iy >= d) iy = d - 1;
        cells[iy * d + ix] += 1;
      }
      counted = n;
      series.push({ x: Math.log2(n), n: n, s: Billiard.entropy({ cells: cells, count: n }) });
    }
    return series;
  }

  /* ------------------------------------------------------------ 状態 */

  /* 衝突回数の上限。これを超える値を入れても丸める（受け入れ基準9）。
     暫定値。実測して 5 秒を超えるようなら下げる（docs/requirements.md 未決事項4）。 */
  var MAX_N = 20000;

  /* 既定値の出典は docs/contracts.md §4（main/stadium/poincare.py と同じ）。 */
  var state = {
    shapeId: "stadium",
    params: { W: 5.0, H: 5.0 },
    p0: [0.5, 0.0],
    v0: [0.02 / Math.sqrt(29), 0.05 / Math.sqrt(29)],
    N: 2000,
    pendingN: 2000,   // 入力欄の値。「計算」を押すまで N には入らない
    frame: 2000,
    hi: null,
    collisions: [],
    pts: [],
    stop: null,
    ms: 0,
    dirty: false,     // 衝突回数を変えたが未計算
    invalid: false,   // 初期条件が不正
    mode: "all",      // "all" = 一括表示 / "anim" = アニメーション
    speed: 4,         // アニメーション1コマあたりに進める衝突数
    view: "single"    // single / mix / occupancy / entropy
  };

  function shape() { return Billiard.SHAPES[state.shapeId]; }

  var el = {
    shapeSel: document.getElementById("shape-select"),
    params: document.getElementById("shape-params"),
    x: document.getElementById("in-x"),
    y: document.getElementById("in-y"),
    vx: document.getElementById("in-vx"),
    vy: document.getElementById("in-vy"),
    n: document.getElementById("in-n"),
    compute: document.getElementById("btn-compute"),
    msgPos: document.getElementById("msg-position"),
    msgVel: document.getElementById("msg-velocity"),
    msgBound: document.getElementById("msg-bound"),
    msgNotice: document.getElementById("msg-notice")
  };

  var orbitCv = document.getElementById("orbit-canvas");
  var sectionCv = document.getElementById("section-canvas");
  var statusEl = document.getElementById("sim-status");
  var stopEl = document.getElementById("sim-stop");

  /* ------------------------------------------------------------ 計算と描画 */

  function recompute() {
    var sh = shape();
    var t0 = performance.now();
    var run = Billiard.simulate(sh, state.params, state.p0, state.v0, state.N);
    state.ms = performance.now() - t0;

    state.collisions = run.collisions;
    state.stop = run.stop;
    state.pts = Billiard.section(sh, state.params, run.collisions);
    // 一括表示なら最後まで、アニメーションなら頭から見せる。
    state.frame = (state.mode === "anim") ? 0 : run.collisions.length;
    state.hi = null;
    // 索引は捨てるだけ。作り直しは最初にホバーされたとき（pickAt）に任せる。
    // ここで作ると、この関数は再生ブロックより前に走るため
    // まだ var の初期化が済んでおらず PICK_NX が undefined になる。
    pickIndex = null;
  }

  /* 未計算・入力エラーのとき、古い図をそのまま残さないための空表示
     （受け入れ基準7・8）。 */
  function drawEmpty(text) {
    var T = readTokens();
    [orbitCv, sectionCv].forEach(function (cv) {
      if (!cv) return;
      var g = fitCanvas(cv), ctx = g.ctx;
      if (g.w < 4 || g.h < 4) return;

      ctx.save();
      ctx.strokeStyle = T.rule;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(8.5, 8.5, g.w - 17, g.h - 17);
      ctx.restore();

      ctx.fillStyle = T.tick;
      ctx.font = "12px " + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, g.w / 2, g.h / 2);
    });
  }

  function draw() {
    if (!orbitCv || !sectionCv) return;
    var sh = shape();
    var T = readTokens();

    if (state.view === "mix") {
      drawSectionMix(sectionCv, sh, state.params, mixState.runs || [], T);
      return;
    }
    if (state.view === "occupancy") {
      drawOrbit(orbitCv, sh, state.params, state.p0,
        state.collisions, state.collisions.length, null, T, state.v0);
      drawHeat(sectionCv, sh, state.params,
        Billiard.histogram(sh, state.params, state.pts, gridState.divide), T);
      return;
    }
    if (state.view === "entropy") {
      drawEntropy(sectionCv, entropySeries(), gridState.divide, T);
      return;
    }
    drawOrbit(orbitCv, sh, state.params, state.p0,
      state.collisions, state.frame, state.hi, T, state.v0);
    drawSection(sectionCv, sh, state.params,
      state.pts, state.frame, state.hi, T);
  }

  function updateStatus() {
    if (!statusEl) return;
    var sh = shape();
    var ps = sh.params.map(function (spec) {
      return spec.label + "=" + state.params[spec.key];
    }).join("  ");

    var tail;
    if (state.invalid) {
      tail = "計算していません";
    } else if (state.view === "mix") {
      tail = mixState.runs
        ? "初期値 " + mixState.epoch + " 本 x 衝突 " + mixState.mixN + " = " +
          (mixState.epoch * mixState.mixN) + " 衝突   計算 " + mixState.ms.toFixed(0) + " ms"
        : "未計算";
    } else if (state.dirty) {
      tail = "未計算（衝突回数 " + state.pendingN + " で「計算」を押してください）";
    } else if (state.view === "occupancy") {
      var hist = Billiard.histogram(sh, state.params, state.pts, gridState.divide);
      var used = 0, mx = 0;
      for (var i = 0; i < hist.cells.length; i++) {
        if (hist.cells[i] > 0) { used++; if (hist.cells[i] > mx) mx = hist.cells[i]; }
      }
      tail = "divide=" + gridState.divide + "   衝突 " + hist.count +
        "   使われたセル " + used + " / " + (gridState.divide * gridState.divide) +
        "   最大 " + mx;
    } else if (state.view === "entropy") {
      var se = entropySeries();
      var last = se.length ? se[se.length - 1] : null;
      tail = "divide=" + gridState.divide + "   刻み " + gridState.step +
        "   点数 " + se.length +
        (last ? "   S(" + last.n + ") = " + last.s.toFixed(4) +
          " / 上限 " + Billiard.maxEntropy(gridState.divide).toFixed(4) : "");
    } else {
      tail = "衝突 " + state.collisions.length + " 回   計算 " + state.ms.toFixed(1) + " ms";
    }

    statusEl.textContent = sh.label + "   " + ps + "   " + tail;

    if (stopEl) {
      // 交点が求まらずに止まった場合。黙って短い軌道を出さない。
      stopEl.textContent = (!state.invalid && !state.dirty && state.stop)
        ? "衝突 " + state.stop.at + " 回目で計算が止まりました（" + state.stop.reason + "）"
        : "";
    }
  }

  /* ------------------------------------------------------------ 入力の検証 */

  function positionProblem() {
    var sh = shape(), P = state.params, p = state.p0;
    if (!isFinite(p[0]) || !isFinite(p[1])) return "x と y に数値を入れてください";
    if (sh.contains(P, p)) return "";
    // シナイだけは「外壁の内側だが障害物の中」という間違え方をしやすいので分けて出す。
    if (state.shapeId === "sinai" &&
        Math.abs(p[0]) < P.W / 2 && Math.abs(p[1]) < P.H / 2) {
      return "初期位置が中央の障害物（D = " + P.D + "）の内側です";
    }
    return "初期位置が領域内にありません";
  }

  function velocityProblem() {
    var v = state.v0;
    if (!isFinite(v[0]) || !isFinite(v[1])) return "vx と vy に数値を入れてください";
    if (v[0] === 0 && v[1] === 0) return "初速度が 0 です";
    return "";
  }

  function notice(text) {
    if (el.msgNotice) el.msgNotice.textContent = text || "";
  }

  /* 入力の状態を見て、描くか・空表示にするかを決める唯一の場所。
     recompute を呼ぶかどうかも含めてここに集約し、
     「片方の図だけ古いまま」が起きないようにする（受け入れ基準12・18）。 */
  function update(opts) {
    var pos = positionProblem();
    var vel = velocityProblem();

    el.msgPos.textContent = pos;
    el.msgVel.textContent = vel;
    el.x.classList.toggle("bad", !!pos);
    el.y.classList.toggle("bad", !!pos);
    el.vx.classList.toggle("bad", !!vel);
    el.vy.classList.toggle("bad", !!vel);

    state.invalid = !!(pos || vel);
    el.compute.disabled = state.invalid;

    if (state.invalid) {
      drawEmpty("初期条件を直してください");
    } else if (state.dirty && state.view !== "mix") {
      drawEmpty("「計算」を押すと表示されます");
    } else {
      if (opts && opts.recompute) recompute();
      if (state.view === "mix" && !mixState.runs) computeMix();
      draw();
    }
    syncFrameUI();
    updateStatus();
  }

  /* ------------------------------------------------------------ 入力欄 */

  var paramInputs = {};   // key -> {range, num}

  function buildShapeSelect() {
    Billiard.SHAPE_ORDER.forEach(function (id) {
      var op = document.createElement("option");
      op.value = id;
      op.textContent = Billiard.SHAPES[id].label;
      el.shapeSel.appendChild(op);
    });
  }

  /* 形状ごとに必要なパラメータだけを出す（受け入れ基準1）。
     欄の定義は shape.params にあるので、ここは形状を知らない。 */
  function buildParams() {
    var sh = shape();
    el.params.innerHTML = "";
    paramInputs = {};

    sh.params.forEach(function (spec) {
      var row = document.createElement("div");
      row.className = "param";

      var lab = document.createElement("label");
      lab.textContent = spec.label;

      var rng = document.createElement("input");
      rng.type = "range";
      rng.min = spec.min;
      rng.max = spec.max;
      rng.step = spec.step;
      rng.setAttribute("aria-label", spec.label);

      var num = document.createElement("input");
      num.type = "number";
      num.step = spec.step;
      num.setAttribute("aria-label", spec.label);

      row.appendChild(lab);
      row.appendChild(rng);
      row.appendChild(num);
      el.params.appendChild(row);

      /* スライダーは input（ドラッグ中も即時に追随）。
         W を振ってカオス化がどこで始まるかを見る、という本来の用途がここ。 */
      rng.addEventListener("input", function () {
        state.params[spec.key] = Number(rng.value);
        num.value = rng.value;
        afterGeometryChange();
      });

      /* 数値欄は change（blur / Enter）。入力中の1文字ごとには再計算しない
         （受け入れ基準6）。 */
      num.addEventListener("change", function () {
        var v = Number(num.value);
        if (!isFinite(v)) { num.value = state.params[spec.key]; return; }
        if (v < spec.min) v = spec.min;     // 物理的に成り立たない値だけ弾く
        num.value = v;
        state.params[spec.key] = v;
        rng.value = Math.min(spec.max, v);  // スライダーの範囲外は端で止める
        afterGeometryChange();
      });

      paramInputs[spec.key] = { range: rng, num: num };
    });
  }

  function syncInputs() {
    el.shapeSel.value = state.shapeId;
    shape().params.forEach(function (spec) {
      var pi = paramInputs[spec.key];
      if (!pi) return;
      var v = state.params[spec.key];
      pi.num.value = v;
      pi.range.value = Math.min(spec.max, Math.max(spec.min, v));
    });
    el.x.value = state.p0[0];
    el.y.value = state.p0[1];
    el.vx.value = state.v0[0];
    el.vy.value = state.v0[1];
    el.n.value = state.pendingN;
  }

  /* 形状・形状パラメータが変わったときの後始末。
     初期位置が新しい領域の外に出たら既定位置へ戻す（受け入れ基準4）。
     利用者が自分で入れた初期位置が領域外の場合は戻さずエラーにする（受け入れ基準8）ので、
     入口を分けてある。 */
  function afterGeometryChange() {
    var sh = shape();
    if (!sh.contains(state.params, state.p0)) {
      state.p0 = sh.defaultPosition(state.params);
      notice("初期位置が新しい領域の外に出たため、領域内の既定位置 (" +
        state.p0[0] + ", " + state.p0[1] + ") に戻しました");
    } else {
      notice("");
    }
    mixState.runs = null;      // 形状が変わったら初期値も撒き直す
    syncInputs();
    update({ recompute: true });
  }

  /* ------------------------------------------------------------ 配線 */

  buildShapeSelect();
  buildParams();
  syncInputs();

  el.shapeSel.addEventListener("change", function () {
    state.shapeId = el.shapeSel.value;
    // 形状ごとの既定値に入れ替える。前の形状の W をそのまま持ち込むと
    // シナイの W < D のような成り立たない組み合わせになりうる。
    var P = {};
    shape().params.forEach(function (spec) { P[spec.key] = spec.def; });
    state.params = P;
    buildParams();
    afterGeometryChange();
  });

  function readPosition() {
    state.p0 = [Number(el.x.value), Number(el.y.value)];
    notice("");
    update({ recompute: true });
  }
  function readVelocity() {
    state.v0 = [Number(el.vx.value), Number(el.vy.value)];
    notice("");
    update({ recompute: true });
  }

  el.x.addEventListener("change", readPosition);
  el.y.addEventListener("change", readPosition);
  el.vx.addEventListener("change", readVelocity);
  el.vy.addEventListener("change", readVelocity);

  /* 衝突回数だけは即時に計算しない。
     20000 回を即時再計算にすると、入力の1文字ごとに固まる（差し戻し R2）。 */
  function clampN() {
    var raw = el.n.value;
    var v = Math.floor(Number(raw));
    var msg = "";
    if (!isFinite(v) || v < 1) {
      v = 1;
      msg = "1 以上にしました";
    } else if (v > MAX_N) {
      msg = "上限の " + MAX_N + " 回に丸めました（入力値 " + raw + "）";
      v = MAX_N;
    }
    el.n.value = v;
    state.pendingN = v;
    el.msgBound.textContent = msg;
    return v;
  }

  el.n.addEventListener("input", function () {
    /* 打っている途中なので欄の値は書き換えない（丸めるのは change のとき）。
       ただし pendingN は読んでおく。これを忘れると
       「未計算（衝突回数 2000 で…）」のように、欄の表示と食い違う案内が出る。 */
    var v = Math.floor(Number(el.n.value));
    if (isFinite(v) && v >= 1) state.pendingN = v;
    state.dirty = true;
    update({});
  });
  el.n.addEventListener("change", function () {
    clampN();
    state.dirty = true;
    update({});
  });

  el.compute.addEventListener("click", function () {
    state.N = clampN();      // ボタンで blur するので change も走るが、念のため
    state.dirty = false;
    update({ recompute: true });
  });

  /* 枠の幅が変わるとスケールが変わるので描き直す。再計算は不要。 */
  if (window.ResizeObserver && orbitCv) {
    var ro = new ResizeObserver(function () {
      if (state.invalid) drawEmpty("初期条件を直してください");
      else if (state.dirty) drawEmpty("「計算」を押すと表示されます");
      else draw();
    });
    ro.observe(orbitCv);
    ro.observe(sectionCv);
  } else {
    window.addEventListener("resize", function () { draw(); });
  }

  update({ recompute: true });

  // Step 5 と検証から触れるように出しておく。
  window.__sim = {
    state: state, update: update, draw: draw, recompute: recompute,
    el: el, MAX_N: MAX_N, syncInputs: syncInputs
  };

  /* ------------------------------------------------- 初期条件のドラッグ

     軌道図の上で初期位置と初速度の向きを直接いじれるようにする。
     数値欄で (x, y, vx, vy) を打つより、境界のどこから撃つとどう変わるかを
     探すのがずっと速い。

     pointer 系のイベントを使うのはマウスとタッチを1本で扱うため。
     setPointerCapture しておくと、canvas の外へドラッグしても追随する。 */

  var dragMode = null;    // null / "pos"（初期位置） / "vel"（初速度の向き）

  // 重ね描きは初期条件を自動で撒くので触らせない。
  // エントロピーは軌道図を出していないので対象外。
  function canDrag() {
    return state.view === "single" || state.view === "occupancy";
  }

  function orbitPr() {
    if (!orbitCv || !orbitCv.clientWidth) return null;
    return orbitProjector(shape(), state.params,
      orbitCv.clientWidth, orbitCv.clientHeight);
  }

  // 内容ボックス基準の座標にそろえる（断面のホバーと同じ理由。ボーダーぶんを引く）
  function canvasPoint(cv, ev) {
    var r = cv.getBoundingClientRect();
    return [ev.clientX - r.left - cv.clientLeft,
            ev.clientY - r.top - cv.clientTop];
  }

  function hitTarget(pr, m) {
    var tip = velocityHandle(pr, state.p0, state.v0);
    if (dist2(m, tip) <= GRAB_PX * GRAB_PX) return "vel";
    var sp = pr.toScreen(state.p0[0], state.p0[1]);
    if (dist2(m, sp) <= GRAB_PX * GRAB_PX) return "pos";
    return null;
  }

  function applyDrag(m, pr) {
    if (dragMode === "vel") {
      var sp = pr.toScreen(state.p0[0], state.p0[1]);
      var dx = m[0] - sp[0];
      var dy = sp[1] - m[1];              // 画面の y は下向き正なので反転
      var L = Math.hypot(dx, dy);
      if (L < 1e-9) return;               // 始点と重なったら向きが決まらない
      // 速さは変えない。衝突列は向きだけで決まるので、矢印の長さに意味を持たせない。
      var speed = Billiard.norm2(state.v0) || 0.01;
      state.v0 = [dx / L * speed, dy / L * speed];
    } else {
      var w = pr.toWorld(m[0], m[1]);
      // 領域の外へは出さない。掴んだまま外へ振っても、最後に有効だった位置が残る。
      if (!shape().contains(state.params, w)) return;
      state.p0 = w;
    }
    notice("");
    syncInputs();
    update({ recompute: true });
  }

  if (orbitCv) {
    orbitCv.addEventListener("pointerdown", function (ev) {
      if (!canDrag()) return;
      var pr = orbitPr();
      if (!pr) return;

      var m = canvasPoint(orbitCv, ev);
      var hit = hitTarget(pr, m);
      // ハンドルから離れた場所を押したときは、そこが領域内なら初期位置を移す。
      // 「掴んでから動かす」を強制すると、遠くへ飛ばすのに何度もドラッグが要る。
      if (!hit) {
        if (!shape().contains(state.params, pr.toWorld(m[0], m[1]))) return;
        hit = "pos";
      }
      dragMode = hit;
      orbitCv.setPointerCapture(ev.pointerId);
      applyDrag(m, pr);
      ev.preventDefault();
    });

    orbitCv.addEventListener("pointermove", function (ev) {
      var pr = orbitPr();
      if (!pr) return;
      var m = canvasPoint(orbitCv, ev);

      if (dragMode) { applyDrag(m, pr); return; }

      // 掴めるところではカーソルを変える
      if (!canDrag()) { orbitCv.style.cursor = "default"; return; }
      orbitCv.style.cursor = hitTarget(pr, m) ? "grab"
        : (shape().contains(state.params, pr.toWorld(m[0], m[1])) ? "crosshair" : "default");
    });

    function endDrag(ev) {
      if (!dragMode) return;
      dragMode = null;
      if (ev && ev.pointerId != null && orbitCv.hasPointerCapture(ev.pointerId)) {
        orbitCv.releasePointerCapture(ev.pointerId);
      }
    }
    orbitCv.addEventListener("pointerup", endDrag);
    orbitCv.addEventListener("pointercancel", endDrag);
    orbitCv.addEventListener("lostpointercapture", endDrag);
  }

  /* -------------------------------------------------- タブと解析まわりの配線 */

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
    b.addEventListener("click", function () {
      if (state.view === b.dataset.view) return;
      state.view = b.dataset.view;
      applyView();
    });
  });

  /* スライダーと数値欄の2つ組を1つの値に束ねる。
     liveRange = false のときはドラッグ中に発火しない。重ね描きは
     本数 x 衝突回数ぶんの計算が走るので、離した時点(change)で初めて計算する。 */
  function bindPair(rangeId, numId, get, set, onChange, liveRange) {
    var rng = document.getElementById(rangeId);
    var num = document.getElementById(numId);
    if (!rng || !num) return;

    rng.value = get();
    num.value = get();

    rng.addEventListener(liveRange === false ? "change" : "input", function () {
      set(Number(rng.value));
      num.value = rng.value;
      onChange();
    });
    rng.addEventListener("input", function () { num.value = rng.value; });

    num.addEventListener("change", function () {
      var v = Number(num.value);
      if (!isFinite(v)) { num.value = get(); return; }
      v = Math.max(Number(num.min) || 1, Math.floor(v));
      num.value = v;
      set(v);
      rng.value = Math.min(Number(rng.max), Math.max(Number(rng.min), v));
      onChange();
    });
  }

  function remix() { mixState.runs = null; update({}); }

  bindPair("in-epoch", "in-epoch-n",
    function () { return mixState.epoch; },
    function (v) { mixState.epoch = v; }, remix, false);
  bindPair("in-mixn", "in-mixn-n",
    function () { return mixState.mixN; },
    function (v) { mixState.mixN = v; }, remix, false);
  bindPair("in-seed", "in-seed-n",
    function () { return mixState.seed; },
    function (v) { mixState.seed = v; }, remix, false);

  // 分割数と刻みは再計算が要らない（集計し直すだけ）ので、ドラッグ中も追随させる
  bindPair("in-divide", "in-divide-n",
    function () { return gridState.divide; },
    function (v) { gridState.divide = v; }, function () { update({}); }, true);
  bindPair("in-step", "in-step-n",
    function () { return gridState.step; },
    function (v) { gridState.step = v; }, function () { update({}); }, true);

  applyView();

  /* ------------------------------------------------------------ 再生 */

  var playEl = {
    play: document.getElementById("btn-play"),
    frame: document.getElementById("in-frame"),
    label: document.getElementById("frame-label"),
    speed: document.getElementById("in-speed"),
    hover: document.getElementById("sim-hover")
  };

  /* 動きを減らす設定の人には、モードを切り替えただけで勝手に動き出さないようにする。
     「再生」を押したときだけ動く。既定が一括表示なので、押さなければ一切動かない。 */
  var reduceMotion = !!(window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var playing = false;
  var rafId = 0;

  function totalFrames() { return state.collisions.length; }

  function syncFrameUI() {
    // update() から呼ばれるが、そちらの方がこのブロックより先に走るので
    // playEl はまだ undefined でありうる（var の巻き上げ）。
    if (!playEl || !playEl.frame) return;
    var total = totalFrames();
    playEl.frame.max = total;
    playEl.frame.value = state.frame;
    playEl.frame.disabled = state.invalid || state.dirty || total === 0;
    playEl.play.disabled = playEl.frame.disabled;
    if (playEl.label) playEl.label.textContent = state.frame + " / " + total;
    playEl.play.textContent = playing ? "一時停止" : "再生";
  }

  function stopPlay() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    playing = false;
    syncFrameUI();
  }

  function step() {
    rafId = 0;
    if (!playing) return;

    state.frame = Math.min(totalFrames(), state.frame + state.speed);
    draw();
    syncFrameUI();

    if (state.frame >= totalFrames()) { stopPlay(); return; }
    rafId = requestAnimationFrame(step);
  }

  function startPlay() {
    if (state.invalid || state.dirty || totalFrames() === 0) return;
    // 最後まで行った状態で押したら頭から流し直す（受け入れ基準10 の「再度押すと続きから」は
    // 一時停止からの再開のこと。終端からの再生は先頭に戻すのが自然）。
    if (state.frame >= totalFrames()) state.frame = 0;
    playing = true;
    syncFrameUI();
    rafId = requestAnimationFrame(step);
  }

  if (playEl.play) {
    playEl.play.addEventListener("click", function () {
      if (playing) stopPlay(); else startPlay();      // 一時停止 → 続きから再開
    });
  }

  if (playEl.frame) {
    // スライダーを掴んだら再生は止める。掴んだまま動かされると取り合いになる。
    playEl.frame.addEventListener("input", function () {
      if (playing) stopPlay();
      state.frame = Math.min(totalFrames(), Math.max(0, Math.floor(Number(playEl.frame.value))));
      draw();
      syncFrameUI();
    });
  }

  if (playEl.speed) {
    playEl.speed.addEventListener("change", function () {
      state.speed = Math.max(1, Math.floor(Number(playEl.speed.value)) || 1);
    });
  }

  // 表示モード
  Array.prototype.forEach.call(
    document.querySelectorAll('input[name="mode"]'), function (radio) {
      radio.addEventListener("change", function () {
        if (!radio.checked) return;
        state.mode = radio.value;
        stopPlay();
        if (state.mode === "all") {
          state.frame = totalFrames();
        } else {
          state.frame = 0;
          // 動きを減らす設定でなければ、選んだ時点で流し始める。
          if (!reduceMotion) { draw(); syncFrameUI(); startPlay(); return; }
        }
        draw();
        syncFrameUI();
      });
    });

  /* ------------------------------------------------------- 相互ハイライト */

  /* 断面の点を拾うための格子索引。
     20000 点を毎回なめると mousemove のたびに数ミリ秒かかるので、
     データ座標 (s, sinφ) を固定格子に振り分けておく。
     画面座標ではなくデータ座標で持つのは、リサイズしても作り直さなくて済むため。 */
  var PICK_NX = 128, PICK_NY = 32, PICK_RADIUS = 8;   // RADIUS は画面 px

  function buildPickIndex(sh, P, pts) {
    var rg = sh.range(P), lo = rg[0], hi = rg[1];
    if (!(hi > lo)) return null;

    var cells = new Array(PICK_NX * PICK_NY);
    for (var k = 0; k < pts.length; k++) {
      var ix = Math.floor((pts[k].s - lo) / (hi - lo) * PICK_NX);
      var iy = Math.floor((pts[k].sin + 1) / 2 * PICK_NY);
      if (ix < 0) ix = 0; else if (ix >= PICK_NX) ix = PICK_NX - 1;
      if (iy < 0) iy = 0; else if (iy >= PICK_NY) iy = PICK_NY - 1;
      var c = iy * PICK_NX + ix;
      if (!cells[c]) cells[c] = [];
      cells[c].push(k);
    }
    return { lo: lo, hi: hi, cells: cells };
  }

  var pickIndex = null;

  /* canvas 内の CSS ピクセル座標から、いま描かれている中で最も近い点を返す。
     見つからなければ null。 */
  function pickAt(px, py) {
    if (!sectionCv) return null;
    var sh = shape();
    if (!pickIndex) pickIndex = buildPickIndex(sh, state.params, state.pts);
    if (!pickIndex) return null;
    // fitCanvas と同じ内容ボックスの寸法を使う。ここを rect にすると
    // ボーダーのぶんだけ描画とマウスの座標系がずれる。
    var pr = sectionProjector(sh, state.params,
      sectionCv.clientWidth, sectionCv.clientHeight);
    if (!pr) return null;

    var span = pr.hi - pr.lo;
    var dS = PICK_RADIUS / pr.iw * span;      // 画面半径をデータ座標へ
    var dV = PICK_RADIUS / (pr.ih / 2);

    var s = pr.lo + (px - SEC_PAD.l) / pr.iw * span;
    var v = 1 - (py - SEC_PAD.t) / pr.ih * 2;

    var ix0 = Math.floor((s - dS - pr.lo) / span * PICK_NX);
    var ix1 = Math.floor((s + dS - pr.lo) / span * PICK_NX);
    var iy0 = Math.floor((v - dV + 1) / 2 * PICK_NY);
    var iy1 = Math.floor((v + dV + 1) / 2 * PICK_NY);
    if (ix0 < 0) ix0 = 0; if (ix1 >= PICK_NX) ix1 = PICK_NX - 1;
    if (iy0 < 0) iy0 = 0; if (iy1 >= PICK_NY) iy1 = PICK_NY - 1;

    var best = null, bestD2 = PICK_RADIUS * PICK_RADIUS;
    var limit = Math.min(state.frame, state.pts.length);

    for (var iy = iy0; iy <= iy1; iy++) {
      for (var ix = ix0; ix <= ix1; ix++) {
        var bucket = pickIndex.cells[iy * PICK_NX + ix];
        if (!bucket) continue;
        for (var b = 0; b < bucket.length; b++) {
          var k = bucket[b];
          if (k >= limit) continue;          // まだ描かれていない点は拾わない
          var dx = pr.X(state.pts[k].s) - px;
          var dy = pr.Y(state.pts[k].sin) - py;
          var d2 = dx * dx + dy * dy;
          if (d2 <= bestD2) { bestD2 = d2; best = k; }
        }
      }
    }
    return best;
  }

  function showHover() {
    if (!playEl.hover) return;
    if (state.hi == null) { playEl.hover.textContent = ""; return; }

    var k = state.hi - 1;
    var p = state.pts[k], c = state.collisions[k];
    if (!p || !c) { playEl.hover.textContent = ""; return; }

    var axis = shape().axis === "angle" ? "theta" : "s";
    playEl.hover.textContent =
      "#" + state.hi +
      "   " + axis + " = " + p.s.toFixed(4) +
      "   sinφ = " + p.sin.toFixed(4) +
      "   位置 (" + c.x.toFixed(4) + ", " + c.y.toFixed(4) + ")";
  }

  if (sectionCv) {
    /* ホバーは「断面 → 軌道図」の一方向だけ。
       逆向き（軌道図でホバーして断面を光らせる）は、衝突点が境界上に
       密に重なって1点を指せないので実装しない。衝突番号スライダーで代替する
       （差し戻し R3。docs/requirements.md の非スコープに明記してある）。 */
    sectionCv.addEventListener("mousemove", function (ev) {
      if (state.invalid || state.dirty) return;
      var rect = sectionCv.getBoundingClientRect();
      // clientLeft / clientTop はボーダーの太さ。引かないと内容ボックス基準にならない。
      var hit = pickAt(ev.clientX - rect.left - sectionCv.clientLeft,
                       ev.clientY - rect.top - sectionCv.clientTop);
      var next = hit == null ? null : hit + 1;
      if (next === state.hi) return;        // 変化がなければ描き直さない
      state.hi = next;
      draw();
      showHover();
    });

    sectionCv.addEventListener("mouseleave", function () {
      if (state.hi == null) return;
      state.hi = null;
      draw();
      showHover();
    });
  }

  syncFrameUI();

  // 検証用のフック。ヒットテストの索引は閉じ込められているので、外から覗けるようにする。
  window.__sim.debug = {
    pickIndex: function () { return pickIndex; },
    pickAt: pickAt,
    buildPickIndex: buildPickIndex,
    grid: { NX: PICK_NX, NY: PICK_NY, R: PICK_RADIUS }
  };

  /* ------------------------------------------------------------ 検算パネル */

  var out = document.getElementById("verify-out");
  var btn = document.getElementById("verify-run");
  if (!out || !btn) return;

  function fmtErr(x) {
    if (x === 0) return "0";
    return x.toExponential(2);
  }

  function renderVerify() {
    var results = Billiard.selfTest(REFERENCE);
    var allOk = results.length > 0 && results.every(function (r) { return r.ok; });

    var html = '<table><thead><tr>' +
      '<th>形状</th><th>点数</th><th>位置</th><th>速度</th><th>座標 s / θ</th><th>sinφ</th><th>判定</th>' +
      '</tr></thead><tbody>';

    results.forEach(function (r) {
      if (r.note) {
        html += '<tr><td>' + r.label + '</td><td colspan="5">' + r.note +
          '</td><td class="fail">NG</td></tr>';
        return;
      }
      html += '<tr>' +
        '<td>' + r.label + '</td>' +
        '<td>' + r.n + '</td>' +
        '<td>' + fmtErr(r.dPos) + '</td>' +
        '<td>' + fmtErr(r.dVel) + '</td>' +
        '<td>' + fmtErr(r.dCoord) + '</td>' +
        '<td>' + fmtErr(r.dSin) + '</td>' +
        '<td class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? 'OK' : 'NG') + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    html += '<p class="verdict ' + (allOk ? 'pass' : 'fail') + '">' +
      (allOk
        ? '全形状が Python と一致しました（最大絶対誤差 < ' + Billiard.TOLERANCE + '）'
        : '一致しない形状があります') +
      '</p>';

    out.innerHTML = html;
    console.log("[検算]", results);
  }

  btn.addEventListener("click", renderVerify);
  renderVerify();
})();
</script>
